name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #state management
  flutter_bloc: ^8.1.2

  #comparing dart objects
  equatable: ^2.0.5

  #service locator
  get_it: ^7.6.0
  
  #dateFormat
  intl: ^0.18.1

  #Database
  floor: ^1.4.2

  #make request to api
  retrofit: ^4.1.0
  dio: ^5.4.0

  # Firebase
  # Kept current on purpose: the versions inherited from the starter project
  # (firebase_auth 4.x) hit the "PigeonUserDetails" decoding bug, where the
  # native Android SDK answers in a shape the Dart codec cannot read.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0


  #Hooks
  flutter_hooks: ^0.18.3

  #chached image 
  cached_network_image: ^3.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  retrofit_generator: ^8.2.1
  floor_generator: ^1.4.2
  build_runner: ^2.4.13
  

flutter:

  uses-material-design: true

 
  fonts:
    # Bundled rather than fetched at runtime, so the app looks the same on a
    # plane as it does on wifi. Inter ships as a variable font; the weights
    # are selected with fontVariations in app_themes.dart.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf

    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
